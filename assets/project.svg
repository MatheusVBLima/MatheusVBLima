<svg xmlns="http://www.w3.org/2000/svg" width="840" height="252" viewBox="0 0 840 252" role="img" aria-label="Featured project: Todas do ENEM, an AI-powered study platform">
<title>Featured project: Todas do ENEM, an AI-powered study platform</title>
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .in{animation:in .6s ease both}
  @keyframes in{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  .grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#110d1f"/><stop offset="1" stop-color="#0c0a14"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0" r="0.75"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".38"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".07"/></pattern>
</defs>
<rect width="840" height="252" rx="18" fill="url(#bgGrad)"/>
<rect width="840" height="252" rx="18" fill="url(#dots)"/>
<rect width="840" height="252" rx="18" fill="url(#glow)"/>
<rect x=".5" y=".5" width="839" height="251" rx="17.5" fill="none" stroke="#2a2342"/>
<g>
<text x="32" y="50" class="mono" font-size="11.5" letter-spacing="2.5" fill="#a78bfa">FEATURED PROJECT</text>
<text x="32" y="92" class="sans" font-size="32" font-weight="700" fill="#f5f3ff" letter-spacing="-.5">Todas do ENEM <tspan fill="#a78bfa" font-size="24">↗</tspan></text>
<text x="32" y="126" class="sans" font-size="15" fill="#a09cb8">A subscription study platform for ENEM, Brazil's national</text>
<text x="32" y="148" class="sans" font-size="15" fill="#a09cb8">exam, used by 740+ students. Founder: I own the whole</text>
<text x="32" y="170" class="sans" font-size="15" fill="#a09cb8">product, from architecture and design to deploy.</text>
<rect x="32" y="186" width="178" height="32" rx="16" fill="#0a0811" stroke="#2a2342"/><circle cx="48" cy="202" r="3" fill="#a78bfa"/><text x="59" y="206.32" class="mono" font-size="12" fill="#f5f3ff">AI essay correction</text><rect x="220" y="186" width="120" height="32" rx="16" fill="#0a0811" stroke="#2a2342"/><circle cx="236" cy="202" r="3" fill="#a78bfa"/><text x="247" y="206.32" class="mono" font-size="12" fill="#f5f3ff">Study plans</text><rect x="350" y="186" width="105" height="32" rx="16" fill="#0a0811" stroke="#2a2342"/><circle cx="366" cy="202" r="3" fill="#a78bfa"/><text x="377" y="206.32" class="mono" font-size="12" fill="#f5f3ff">AI agents</text>
</g>
<rect x="548" y="32" width="260" height="188" rx="12" fill="#0a0811" fill-opacity=".92" stroke="#2a2342"/>
<text x="566" y="60" class="mono" font-size="11.5" fill="#f5f3ff">essay.feedback</text>
<text x="790" y="60" text-anchor="end" class="mono" font-size="11" fill="#a78bfa">● AI</text><text x="566" y="94" class="mono" font-size="11" fill="#6e6888">C1</text>
<rect x="600" y="86" width="184" height="8" rx="4" fill="#1d1830"/>
<rect class="grow" style="animation-delay:0.3s" x="600" y="86" width="158" height="8" rx="4" fill="url(#bar)"/><text x="566" y="118" class="mono" font-size="11" fill="#6e6888">C2</text>
<rect x="600" y="110" width="184" height="8" rx="4" fill="#1d1830"/>
<rect class="grow" style="animation-delay:0.42s" x="600" y="110" width="136" height="8" rx="4" fill="url(#bar)"/><text x="566" y="142" class="mono" font-size="11" fill="#6e6888">C3</text>
<rect x="600" y="134" width="184" height="8" rx="4" fill="#1d1830"/>
<rect class="grow" style="animation-delay:0.54s" x="600" y="134" width="169" height="8" rx="4" fill="url(#bar)"/><text x="566" y="166" class="mono" font-size="11" fill="#6e6888">C4</text>
<rect x="600" y="158" width="184" height="8" rx="4" fill="#1d1830"/>
<rect class="grow" style="animation-delay:0.6599999999999999s" x="600" y="158" width="125" height="8" rx="4" fill="url(#bar)"/><text x="566" y="190" class="mono" font-size="11" fill="#6e6888">C5</text>
<rect x="600" y="182" width="184" height="8" rx="4" fill="#1d1830"/>
<rect class="grow" style="animation-delay:0.78s" x="600" y="182" width="147" height="8" rx="4" fill="url(#bar)"/>
</svg>
